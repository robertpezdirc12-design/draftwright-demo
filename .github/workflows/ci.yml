name: Smoke test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm test
      - name: Tests must not modify the working tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Tests modified tracked files or generated untracked files:"
            git status --porcelain
            exit 1
          fi
      - name: Inline modules must match committed js/*.js
        run: |
          node scripts/sync-modules.js
          git diff --exit-code -- tehnicka-risba-pro.html
      - name: CSP hashes must match the committed source
        run: |
          node scripts/generate-csp.js
          git diff --exit-code -- tehnicka-risba-pro.html vercel.json
      - name: SRI hashes must match the committed source
        run: |
          node scripts/generate-sri.js
          git diff --exit-code -- tehnicka-risba-pro.html
